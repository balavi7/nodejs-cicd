name: Nodejs CI
on:
  push:
    branches:
        - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: checkout code
          uses: actions/checkout@v2
        
        - name: Deploy to remote server
          uses: appleboy/ssh-action@v1
          with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                  cd ${{ secrets.EC2_APP_PATH }}
                  ls -la
        

    